
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corp_chat_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}          
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}  
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET=corp-chat-media-dev
      - AWS_ENDPOINT=http://localstack:4566
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      - postgres
      - redis
      - localstack

  postgres:
    image: postgres:15-alpine
    container_name: corp_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: corp_chat_redis
    restart: always
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack
    container_name: corp_chat_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

volumes:
  pgdata: